services:
  ncmm:
    # build 用于本地源码构建；image 同时作为构建标签和官方镜像拉取地址。
    build: .
    image: ghcr.io/3899/ncmm:latest
    container_name: ncmm
    restart: unless-stopped
    ports:
      - "127.0.0.1:3899:3899"
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Asia/Shanghai
      # 可选：显式设置后会跳过 WebUI 首次设置页面。
      # - NCMM_WEB_TOKEN=replace-with-a-long-random-token

      # CookieCloud 配置（服务运行在宿主机时使用 host.docker.internal）
      #- COOKIECLOUD_SERVER=http://host.docker.internal:8088
      #- COOKIECLOUD_UUID=your-uuid
      #- COOKIECLOUD_PASSWORD=your-password

      # 旧版 CRON_* 规则仍受支持，并在 WebUI 中显示为只读规则。
      # 新规则建议直接在 WebUI 的“定时任务”页面创建。
      # - CRON_1=30 8 * * * task
      # - CRON_2=0 14 * * * musician

# ============================================================
# WebUI: http://localhost:3899
# 首次启动请从 docker logs ncmm 获取一次性设置码，再打开 WebUI 设置管理令牌。
# 官方镜像禁止容器内替换二进制，更新请在宿主机执行：
#   docker compose pull ncmm
#   docker compose up -d --force-recreate ncmm
#
# 临时执行单个命令：
#   docker compose run --rm ncmm task
#   docker compose run --rm ncmm sign
#   docker compose run --rm ncmm playids --ids 12345
#   docker compose run --rm ncmm --help
# ============================================================
